name: Build firmware and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade platformio esptool

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build firmware
        run: pio run -e atoms3r_cam

      - name: Assemble versioned browser-flashable image
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p _site/firmware
          cp -R web/. _site/

          SHORT_SHA="\${GITHUB_SHA:0:12}"
          FW_FILE="atoms3r-visual-pose-tracker-\${SHORT_SHA}.bin"

          python -m esptool --chip esp32s3 merge_bin \
            -o "_site/firmware/\${FW_FILE}" \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 8MB \
            0x0 .pio/build/atoms3r_cam/bootloader.bin \
            0x8000 .pio/build/atoms3r_cam/partitions.bin \
            0x10000 .pio/build/atoms3r_cam/firmware.bin

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"][:12]
          fw_file = f"atoms3r-visual-pose-tracker-{sha}.bin"
          manifest_path = Path("_site/manifest.json")
          text = manifest_path.read_text(encoding="utf-8")
          text = text.replace("__VERSION__", sha)
          text = text.replace("__FIRMWARE_FILE__", fw_file)
          manifest_path.write_text(text, encoding="utf-8")

          manifest = json.loads(text)
          actual = manifest["builds"][0]["parts"][0]["path"]
          expected = f"firmware/{fw_file}"
          if actual != expected:
              raise SystemExit(f"manifest path mismatch: {actual} != {expected}")
          target = Path("_site", actual)
          if not target.is_file():
              raise SystemExit(f"manifest target missing: {target}")
          print("DEPLOY_VERSION=" + manifest["version"])
          print("DEPLOY_FIRMWARE=" + actual)
          print("DEPLOY_SIZE=" + str(target.stat().st_size))
          PY

          echo "--- manifest.json ---"
          cat _site/manifest.json
          echo
          echo "--- firmware files ---"
          ls -lh _site/firmware

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
