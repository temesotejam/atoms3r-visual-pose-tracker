name: Build firmware and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade platformio esptool

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build firmware
        run: pio run -e atoms3r_cam

      - name: Assemble browser-flashable image
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p _site/firmware
          cp -R web/. _site/
          python -m esptool --chip esp32s3 merge_bin \
            -o _site/firmware/atoms3r-visual-pose-tracker.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 8MB \
            0x0 .pio/build/atoms3r_cam/bootloader.bin \
            0x8000 .pio/build/atoms3r_cam/partitions.bin \
            0x10000 .pio/build/atoms3r_cam/firmware.bin

      - name: Publish build metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          manifest_path = "_site/manifest.json"
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = os.environ["GITHUB_SHA"][:12]
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
